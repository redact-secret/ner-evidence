name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # snapshot immutability compares against the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Repository gates (schema, provenance, privacy, lineage, determinism, snapshots)
        run: PYTHONPATH=src python -m ner_evidence check --base origin/main
