[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ner-evidence-tools"
version = "0.1.0"
description = "Validation, projection and snapshot tooling for the ner-evidence repository"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ner-evidence = "ner_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
